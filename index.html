<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西音磕考队之书</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="corpus.js"></script>
<style>
:root{
  --bg:#14100c;--ink:#f0e6d2;--ink-soft:#c9b896;--ink-faint:#7a6a52;
  --gold:#c8a971;--gold-glow:rgba(200,169,113,.12);
  --dur-header:1.2s;
  --dur-question:1.2s;
  --dur-thinking:900ms;
  --dur-reveal:1s;
  --dur-actions:.8s;
  --dur-close:.25s;
  --dur-ask-hover:.45s;
  --delay-actions:.7s;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light dark}
html,body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC",serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(ellipse at 50% 20%, rgba(200,169,113,.09) 0%, transparent 55%),
  radial-gradient(ellipse at 50% 85%, rgba(154,59,42,.05) 0%, transparent 60%),
  var(--bg);position:relative}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");opacity:.05;pointer-events:none;mix-blend-mode:overlay;z-index:1}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.45) 100%);pointer-events:none;z-index:2}

.container{position:relative;z-index:3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:15vh 1.5rem 5rem;max-width:680px;margin:0 auto}

/* header */
.header{text-align:center;margin-bottom:3.5rem;animation:fadeIn var(--dur-header) ease-out}
.ornament{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--gold);font-size:.85rem;letter-spacing:.35em;text-transform:uppercase;margin-bottom:1rem;opacity:.85}
.title{font-size:clamp(1.7rem,5vw,2.6rem);font-weight:500;letter-spacing:.3em;color:var(--ink);margin-bottom:1rem;padding-left:.3em}
.rule{width:60px;height:1px;background:var(--gold);margin:0 auto 1rem;opacity:.6}
.subtitle{color:var(--ink-faint);font-size:.9rem;letter-spacing:.2em;font-weight:300}

/* input */
.question-area{width:100%;animation:fadeIn var(--dur-question) ease-out .3s backwards}
.ask-btn{transition:opacity .5s ease, transform .5s ease, all var(--dur-ask-hover) ease}
.ask-btn.hidden{opacity:0;transform:translateY(-6px);pointer-events:none;visibility:hidden}
#question{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(122,106,82,.5);padding:.8rem .5rem;color:var(--ink);font-family:inherit;font-size:1.05rem;text-align:center;outline:none;transition:border-color .4s ease;margin-bottom:2rem}
#question:focus{border-bottom-color:var(--gold)}
#question::placeholder{color:var(--ink-faint);opacity:.5;transition:opacity .35s ease}
#question:focus::placeholder{opacity:0}
.ask-btn{display:block;margin:0 auto;background:transparent;border:1px solid var(--gold);color:var(--gold);font-family:"Noto Serif SC",serif;font-size:.95rem;letter-spacing:.4em;padding:.75rem 2.5rem .75rem 2.9rem;cursor:pointer;transition:all var(--dur-ask-hover) ease}
.ask-btn:hover{background:var(--gold-glow);letter-spacing:.55em;padding-left:3.05rem;padding-right:2.65rem}
.ask-btn:active{transform:scale(.98)}

/* answer */
.answer-area{margin-top:-3.2rem;min-height:140px;width:100%;text-align:center;pointer-events:none}
.answer-area:not(:empty){pointer-events:auto}
.qecho{font-family:"Noto Serif SC",serif;font-size:1.05rem;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:2rem;line-height:1.6;opacity:0;padding-bottom:1.2rem;border-bottom:1px solid rgba(122,106,82,.3);max-width:85%;margin-left:auto;margin-right:auto}
.qecho.show{animation:qechoIn 1s .05s ease-out forwards}
.qecho::before{content:'「'}
.qecho::after{content:'」'}
.answer{opacity:0}
.answer.show{animation:revealAnswer var(--dur-reveal) ease-out forwards}
.quote{font-size:clamp(1.5rem,3.6vw,1.95rem);line-height:1.8;color:var(--ink);font-weight:400;margin-bottom:1.4rem;letter-spacing:.05em}
.attribution{font-size:.95rem;color:var(--ink-soft);letter-spacing:.08em}
.attribution .dash{color:var(--gold);margin-right:.2em}
.attribution .author{color:var(--gold);font-weight:500}
.again{display:inline-block;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.9rem;color:var(--ink-faint);cursor:pointer;letter-spacing:.15em;transition:color .3s ease;padding-bottom:2px;border-bottom:1px solid transparent}
.actions{display:none;align-items:center;gap:.9rem;margin-top:2.2rem;opacity:0}
.actions.show{display:inline-flex;animation:fadeIn var(--dur-actions) ease-out var(--delay-actions) backwards;opacity:1}
.actions .sep{color:var(--ink-faint);opacity:.5}
.again:hover{color:var(--gold);border-bottom-color:var(--gold)}
.thinking{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--ink-faint);letter-spacing:.2em;font-size:.95rem;opacity:.6;animation:pulse 1.8s ease-in-out 1s infinite}

/* fade-out on close (also for qecho) */
.answer.closing, .actions.closing, .qecho.closing{animation:closeBook var(--dur-close) ease-out forwards}

@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes qechoIn{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes revealAnswer{0%{opacity:0}100%{opacity:1}}
@keyframes closeBook{0%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:.9}}

.footer-mark{position:fixed;bottom:1.3rem;left:50%;transform:translateX(-50%);font-family:"Cormorant Garamond",serif;font-size:.7rem;color:var(--ink-faint);letter-spacing:.4em;opacity:.45;z-index:3;white-space:nowrap}

@media (max-width:600px){
  .container{padding:2rem 1.25rem 4.5rem}
  .header{margin-bottom:2.5rem}
  .answer-area{margin-top:2.5rem}
  .ask-btn{letter-spacing:.3em;padding:.75rem 2rem .75rem 2.3rem}
  .ask-btn:hover{letter-spacing:.4em;padding-left:2.4rem;padding-right:1.9rem}
  .title{letter-spacing:.18em;padding-left:.09em}
  .music-player{top:1rem;left:1rem;gap:.55rem}
  .music-credit{font-size:.65rem;max-width:180px}
}
@media (max-width:400px){
  .title{font-size:clamp(1.55rem,6vw,1.9rem);letter-spacing:.13em}
}

/* music player */
.music-player{position:absolute;top:1.3rem;left:1.3rem;z-index:10;display:flex;align-items:center;gap:.75rem}.music-toggle{width:38px;height:38px;border:none;background:transparent;color:var(--ink-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;line-height:1;transition:color .8s ease, opacity .8s ease;opacity:.5;flex-shrink:0;padding:0}
.music-toggle.playing{color:var(--gold);opacity:1}
.music-toggle.loading{animation:musicBreath 1.8s ease-in-out infinite;cursor:wait}
@keyframes musicBreath{0%,100%{color:var(--ink-faint);opacity:.5}50%{color:var(--gold);opacity:1}}
.music-credit{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.72rem;color:var(--ink-faint);letter-spacing:.04em;line-height:1.45;max-width:240px;user-select:none;opacity:0;transform:translateY(3px);transition:opacity .9s ease, transform .9s ease;pointer-events:none}
.music-credit.revealed{opacity:.55;transform:translateY(0);pointer-events:auto}
.music-credit a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(122,106,82,.35);transition:color .3s, border-color .3s}
.music-credit a:hover{color:var(--gold);border-bottom-color:var(--gold)}

/* Tweaks panel */
.tweaks-panel{position:fixed;bottom:1.25rem;right:1.25rem;z-index:100;background:rgba(20,16,12,.94);border:1px solid rgba(200,169,113,.35);padding:1rem 1.1rem .85rem;font-family:"Cormorant Garamond",serif;color:var(--ink-soft);box-shadow:0 8px 32px rgba(0,0,0,.5);backdrop-filter:blur(8px);max-width:280px;display:none}
.tweaks-panel.open{display:block}
.tweaks-panel h3{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.75rem;font-weight:500;font-style:italic}
.tweak-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.45rem;font-size:.82rem}
.tweak-row label{color:var(--ink-soft);flex:0 0 auto;font-style:italic}
.tweak-row input[type=range]{flex:1;min-width:0;accent-color:var(--gold);height:2px}
.tweak-row .val{color:var(--gold);font-size:.72rem;font-family:"Cormorant Garamond",serif;min-width:48px;text-align:right;letter-spacing:.02em}
.tweak-reset{margin-top:.5rem;background:transparent;border:1px solid rgba(200,169,113,.4);color:var(--gold);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.78rem;letter-spacing:.15em;padding:.35rem .9rem;cursor:pointer;width:100%;transition:background .3s ease}
.tweak-reset:hover{background:var(--gold-glow)}
</style>
</head>
<body>
<div class="container">
  <header class="header" id="header">
    <div class="ornament">怀师，海狮，鱼师共著</div>
    <h1 class="title">西音磕考队之书</h1>
    <div class="rule"></div>
    <div class="subtitle">道出心中所问，她们便会答你</div>
  </header>

  <div class="question-area" id="questionArea">
    <input type="text" id="question" autocomplete="off" placeholder="说说你的迷惘吧……">
    <button class="ask-btn" id="askBtn">求 答</button>
  </div>

  <div class="answer-area" id="answerArea"></div>
</div>

<audio id="bgm" loop preload="none"></audio>

<div class="tweaks-panel" id="tweaksPanel">
  <h3>Tweaks — 动画时长</h3>
  <div class="tweak-row"><label>标题淡入</label><input type="range" data-key="headerMs" min="0" max="3000" step="50"><span class="val"></span></div>
  <div class="tweak-row"><label>输入淡入</label><input type="range" data-key="questionMs" min="0" max="3000" step="50"><span class="val"></span></div>
  <div class="tweak-row"><label>翻阅停顿</label><input type="range" data-key="thinkingMs" min="0" max="4000" step="50"><span class="val"></span></div>
  <div class="tweak-row"><label>答案浮现</label><input type="range" data-key="revealMs" min="0" max="3000" step="50"><span class="val"></span></div>
  <div class="tweak-row"><label>按钮淡入</label><input type="range" data-key="actionsMs" min="0" max="3000" step="50"><span class="val"></span></div>
  <div class="tweak-row"><label>按钮延迟</label><input type="range" data-key="actionsDelayMs" min="0" max="3000" step="50"><span class="val"></span></div>
  <div class="tweak-row"><label>合上书</label><input type="range" data-key="closeMs" min="0" max="2000" step="25"><span class="val"></span></div>
  <div class="tweak-row"><label>求答悬停</label><input type="range" data-key="askHoverMs" min="0" max="1500" step="25"><span class="val"></span></div>
  <button class="tweak-reset" id="tweakReset">恢复默认</button>
</div><div class="music-player">
  <button class="music-toggle" id="musicToggle" aria-label="播放/暂停背景音乐" title="播放/暂停背景音乐">♪</button>
  <div class="music-credit">
    Mozart · Fantasia in D minor, K.397<br>
    perf. German Kitkin · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>
  </div>
</div>

<script>
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "headerMs": 1200,
  "questionMs": 1200,
  "thinkingMs": 900,
  "revealMs": 1000,
  "actionsMs": 700,
  "closeMs": 250,
  "askHoverMs": 450,
  "actionsDelayMs": 700
}/*EDITMODE-END*/;

function applyTweaks(t){
  const root = document.documentElement;
  root.style.setProperty('--dur-header', t.headerMs + 'ms');
  root.style.setProperty('--dur-question', t.questionMs + 'ms');
  root.style.setProperty('--dur-reveal', t.revealMs + 'ms');
  root.style.setProperty('--dur-actions', t.actionsMs + 'ms');
  root.style.setProperty('--dur-close', t.closeMs + 'ms');
  root.style.setProperty('--dur-ask-hover', t.askHoverMs + 'ms');
  root.style.setProperty('--delay-actions', t.actionsDelayMs + 'ms');
}
applyTweaks(TWEAK_DEFAULTS);

const TEXT = {
  thinking: "……正在翻阅……",
  again: "再问一次",
  reset: "合上书"
};

// Build messages from corpus.js
const C = window.__CORPUS__;
const messages = C.msgs.map(m => ({ text: m[0], author: C.authors[m[1]], date: C.dates[m[2]] }));

document.title = "西音磕考队之书";

let lastIndex = -1;
function pickRandom(){
  if (messages.length <= 1) return messages[0];
  let idx;
  do { idx = Math.floor(Math.random() * messages.length); } while (idx === lastIndex);
  lastIndex = idx;
  return messages[idx];
}

const askBtn = document.getElementById('askBtn');
const question = document.getElementById('question');
const answerArea = document.getElementById('answerArea');
const header = document.getElementById('header');
const questionArea = document.getElementById('questionArea');

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let closeTimer = null;
let revealTimer = null;
let lastQuestion = '';

function hideAskUI(){ askBtn.classList.add('hidden'); }
function showAskUI(){ askBtn.classList.remove('hidden'); }

function reveal(){
  if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
  if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }

  // capture question text on ask (only the first time; again preserves it)
  if (question.value.trim()) lastQuestion = question.value.trim();

  hideAskUI();
  answerArea.innerHTML = `<div class="thinking">${escapeHtml(TEXT.thinking)}</div>`;
  revealTimer = setTimeout(() => {
    revealTimer = null;
    const m = pickRandom();
    const qEcho = '';
    answerArea.innerHTML = `
      ${qEcho}
      <div class="answer show">
        <div class="quote">${escapeHtml(m.text)}</div>
        <div class="attribution"><span class="dash">——</span><span class="author">${escapeHtml(m.author)}</span>，${escapeHtml(m.date)}</div>
      </div>
      <div class="actions show"><span class="again" id="againBtn">${escapeHtml(TEXT.again)}</span><span class="sep">·</span><span class="again" id="resetBtn">${escapeHtml(TEXT.reset)}</span></div>
    `;
    document.getElementById('againBtn').addEventListener('click', reveal);
    document.getElementById('resetBtn').addEventListener('click', closeBook);
  }, TWEAK_DEFAULTS.thinkingMs);
}

function closeBook(){
  if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
  const qecho = answerArea.querySelector('.qecho');
  const answer = answerArea.querySelector('.answer');
  const actions = answerArea.querySelector('.actions');
  if (qecho) qecho.classList.add('closing');
  if (answer) answer.classList.add('closing');
  if (actions) actions.classList.add('closing');
  if (closeTimer) clearTimeout(closeTimer);
  closeTimer = setTimeout(() => {
    answerArea.innerHTML = '';
    question.value = '';
    lastQuestion = '';
    showAskUI();
    closeTimer = null;
  }, TWEAK_DEFAULTS.closeMs);
}

askBtn.addEventListener('click', reveal);
question.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); reveal(); }
});

// Background music
const bgm = document.getElementById('bgm');
const musicToggle = document.getElementById('musicToggle');
const musicCredit = document.querySelector('.music-credit');
const MUSIC_URL = 'assets/fantasia.mp3';
const TARGET_VOLUME = 0.5;
const FADE_IN_MS = 900;
const FADE_OUT_MS = 700;
bgm.volume = 0;

let audioLoaded = false, isLoading = false, loadController = null, wantPlay = false, currentFade = null;

function fadeVolume(to, duration){
  if (currentFade) currentFade.cancelled = true;
  const fade = { cancelled: false };
  currentFade = fade;
  const from = bgm.volume;
  const delta = to - from;
  const start = performance.now();
  return new Promise(resolve => {
    function step(now){
      if (fade.cancelled) { resolve(false); return; }
      const p = Math.min((now - start) / duration, 1);
      bgm.volume = Math.max(0, Math.min(1, from + delta * p));
      if (p < 1) requestAnimationFrame(step);
      else { if (currentFade === fade) currentFade = null; resolve(true); }
    }
    requestAnimationFrame(step);
  });
}

async function ensureLoaded(){
  if (audioLoaded) return true;
  isLoading = true;
  musicToggle.classList.add('loading');
  loadController = new AbortController();
  try {
    const response = await fetch(MUSIC_URL, { signal: loadController.signal });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const blob = await response.blob();
    bgm.src = URL.createObjectURL(blob);
    await new Promise((resolve, reject) => {
      const cleanup = () => {
        bgm.removeEventListener('loadeddata', onLoaded);
        bgm.removeEventListener('error', onError);
        loadController.signal.removeEventListener('abort', onAbort);
      };
      const onLoaded = () => { cleanup(); resolve(); };
      const onError  = (e) => { cleanup(); reject(e); };
      const onAbort  = () => { cleanup(); reject(new DOMException('Aborted','AbortError')); };
      bgm.addEventListener('loadeddata', onLoaded);
      bgm.addEventListener('error', onError);
      loadController.signal.addEventListener('abort', onAbort);
      bgm.load();
    });
    audioLoaded = true;
    return true;
  } catch(err){
    if (err.name !== 'AbortError') console.warn('音乐加载失败:', err);
    return false;
  } finally {
    isLoading = false;
    musicToggle.classList.remove('loading');
    loadController = null;
  }
}

function setVisualPlaying(on){
  musicToggle.classList.toggle('playing', on);
  musicCredit.classList.toggle('revealed', on);
}

musicToggle.addEventListener('click', async () => {
  if (isLoading){
    wantPlay = false;
    setVisualPlaying(false);
    if (loadController) loadController.abort();
    return;
  }
  wantPlay = !wantPlay;
  if (wantPlay){
    const ok = await ensureLoaded();
    if (!wantPlay) return;
    if (!ok) { wantPlay = false; return; }
    if (bgm.paused){
      bgm.volume = 0;
      try { await bgm.play(); }
      catch(err){ console.warn('播放失败, 请再点一次:', err); wantPlay = false; return; }
    }
    setVisualPlaying(true);
    fadeVolume(TARGET_VOLUME, FADE_IN_MS);
  } else {
    setVisualPlaying(false);
    const completed = await fadeVolume(0, FADE_OUT_MS);
    if (completed && !wantPlay) bgm.pause();
  }
});

// Tweaks: edit mode panel
(function(){
  const panel = document.getElementById('tweaksPanel');
  const rows = panel.querySelectorAll('.tweak-row');
  const state = { ...TWEAK_DEFAULTS };
  const inputs = {};

  function refreshUI(){
    rows.forEach(row => {
      const input = row.querySelector('input');
      const val = row.querySelector('.val');
      const key = input.dataset.key;
      input.value = state[key];
      val.textContent = state[key] + ' ms';
    });
  }

  rows.forEach(row => {
    const input = row.querySelector('input');
    const key = input.dataset.key;
    inputs[key] = input;
    input.addEventListener('input', () => {
      state[key] = parseInt(input.value, 10);
      row.querySelector('.val').textContent = state[key] + ' ms';
      applyTweaks(state);
      // update defaults so reveal/close timers pick up new thinkingMs/closeMs
      TWEAK_DEFAULTS[key] = state[key];
    });
    input.addEventListener('change', () => {
      const edit = {}; edit[key] = state[key];
      window.parent.postMessage({type: '__edit_mode_set_keys', edits: edit}, '*');
    });
  });

  document.getElementById('tweakReset').addEventListener('click', () => {
    const fresh = {"headerMs":1200,"questionMs":1200,"thinkingMs":900,"revealMs":1000,"actionsMs":700,"closeMs":250,"askHoverMs":450,"actionsDelayMs":700};
    Object.assign(state, fresh);
    Object.assign(TWEAK_DEFAULTS, fresh);
    applyTweaks(state);
    refreshUI();
    window.parent.postMessage({type: '__edit_mode_set_keys', edits: fresh}, '*');
  });

  refreshUI();

  window.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.type === '__activate_edit_mode') panel.classList.add('open');
    else if (e.data.type === '__deactivate_edit_mode') panel.classList.remove('open');
  });
  window.parent.postMessage({type: '__edit_mode_available'}, '*');
})();
</script>
</body>
</html>
